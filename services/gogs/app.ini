RUN_MODE = prod
RUN_USER = git

[server]
; Listen on all container interfaces so the published host port reaches it.
HTTP_ADDR     = 0.0.0.0
EXTERNAL_URL = ${GOGS_EXTERNAL_URL}
DOMAIN       = ${GOGS_DOMAIN}
; HTTP stays on the container default 3000; compose maps host ${GOGS_HTTP_PORT:-8550}
; SSH is disabled in v1 (START_SSH_SERVER defaults to false) — clone via HTTP

[repository]
ROOT = /data/git/gogs-repositories

[database]
TYPE = sqlite3
PATH = /data/gogs/data/gogs.db
; PATH must stay inside the mounted /data — the image default resolves to
; /app/gogs/data/gogs.db (container layer) and would be lost on recreate.

[security]
SECRET_KEY = ${GOGS_SECURITY_SECRET_KEY}
