RUN_MODE = prod
RUN_USER = git

[server]
; Listen on all container interfaces so the published host port reaches it.
HTTP_ADDR     = 0.0.0.0
EXTERNAL_URL = ${GOGS_EXTERNAL_URL}
DOMAIN       = ${GOGS_DOMAIN}
; HTTP stays on the container default 3000; compose maps host ${GOGS_HTTP_PORT:-8550}
; SSH is disabled in v1 (START_SSH_SERVER defaults to false) — clone via HTTP

[repository]
ROOT = /data/git/gogs-repositories

[database]
TYPE = sqlite3
PATH = /data/gogs/data/gogs.db
; PATH must stay inside the mounted /data — the image default resolves to
; /app/gogs/data/gogs.db (container layer) and would be lost on recreate.

[security]
; No INSTALL_LOCK here on purpose: in Gogs 0.14.x the install wizard is the only
; path that creates the DB schema (GlobalInit skips DB init entirely while
; unlocked, and a locked empty DB does not self-bootstrap). So a fresh instance
; must run the wizard ONCE. The pre-seeded [database] PATH is kept by the wizard
; (SQLite3 + PATH pre-filled); afterwards Gogs writes INSTALL_LOCK = true here
; and the wizard never appears again — verify with `just gogs-check`.
SECRET_KEY = ${GOGS_SECURITY_SECRET_KEY}
